services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-srpd_biess}
      POSTGRES_USER: ${POSTGRES_USER:-biess}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biess}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
